<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk — MR.TOOLS</title>
<meta name="description" content="Masuk ke MR.TOOLS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/">⚡ MR.TOOLS</a></div></header>
<main class="wrap" style="max-width:520px">
  <div class="announce" id="ann"></div>
  <section class="panel">
    <h2>Masuk</h2>
    <p class="sub">Tools & API tetap gratis tanpa login. Masuk cuma buat dashboard + admin.</p>
    <label class="lbl">Email<input id="email" type="email" autocomplete="email" placeholder="lu@contoh.id"></label>
    <label class="lbl">Password<input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <div class="btns"><button class="btn p" id="go">Masuk →</button></div>
    <div class="out" id="out"></div>
    <p class="small">Belum punya akun? <a href="/signup">Daftar gratis</a></p>
  </section>
</main>
<footer><div class="wrap"><span>MR.TOOLS.</span></div></footer>
<script src="/assets/app.js"></script>
<script>
const $=s=>document.querySelector(s);
$('#go').onclick=async()=>{
  const out=$('#out'); out.textContent='⏳ ngecek...';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});
    const j=await r.json();
    if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status));
    location.href=j.data.role==='admin'?'/admin':'/dashboard';
  }catch(e){ out.textContent='❌ '+e.message; }
};
</script>
</body>
</html>
