<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UUID Generator — MR.TOOLS</title>
<meta name="description" content="Generate UUID v4 gratis, bulk sekaligus. Jalan di browser.">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/">⚡ MR.TOOLS</a></div></header>
<main class="wrap">
<section class="hero"><h1>UUID <span class="hl">Generator</span></h1><p id="tagline">Bikin ID unik v4, bulk sekaligus.</p></section>
<section class="panel">
<label class="lbl">Jumlah (1-100)<input id="n" type="number" value="5" min="1" max="100"></label>
<div class="btns"><button class="btn p" id="go">Generate</button><button class="btn ghost" id="cp">Copy semua</button></div>
<div class="out" id="out"></div>
</section>
</main>
<footer><div class="wrap"><span>MR.TOOLS</span></div></footer>
<script src="/assets/app.js"></script>
<script>
const $=s=>document.querySelector(s);
function gen(){const n=Math.min(Math.max(parseInt($('#n').value)||5,1),100);const a=[];for(let i=0;i<n;i++)a.push(crypto.randomUUID());$('#out').textContent=a.join('\n');}
$('#go').onclick=gen;$('#cp').onclick=()=>copy($('#out').textContent);gen();
</script>
</body>
</html>
