<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Picker HEX RGB HSL — MR.TOOLS</title>
<meta name="description" content="Pilih warna, dapat HEX RGB HSL sekaligus. Gratis.">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/">⚡ MR.TOOLS</a></div></header>
<main class="wrap">
<section class="hero"><h1>Warna <span class="hl">Picker</span></h1><p>Buat desain, coding, cat warung.</p></section>
<section class="panel">
<div class="row">
<label class="lbl">Pilih<input id="pk" type="color" value="#FF6B9D" style="height:56px;padding:4px"></label>
<label class="lbl">HEX<input id="hx" type="text" value="#FF6B9D" maxlength="7"></label>
</div>
<div id="prev" style="height:90px;border:var(--b);border-radius:12px;margin-top:14px;background:#FF6B9D"></div>
<dl class="kv" style="margin-top:14px"><dt>HEX</dt><dd id="oH">-</dd><dt>RGB</dt><dd id="oR">-</dd><dt>HSL</dt><dd id="oS">-</dd></dl>
<div class="btns"><button class="btn" id="cp">Copy HEX</button></div>
</section>
</main>
<footer><div class="wrap"><span>MR.TOOLS</span></div></footer>
<script src="/assets/app.js"></script>
<script>
const $=s=>document.querySelector(s);
function upd(hex){
  hex=hex.startsWith('#')?hex:'#'+hex;
  if(!/^#[0-9a-fA-F]{6}$/.test(hex))return;
  $('#pk').value=hex;$('#hx').value=hex.toUpperCase();$('#prev').style.background=hex;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  $('#oH').textContent=hex.toUpperCase();$('#oR').textContent=`rgb(${r}, ${g}, ${b})`;
  const rn=r/255,gn=g/255,bn=b/255,mx=Math.max(rn,gn,bn),mn=Math.min(rn,gn,bn);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);if(mx===rn)h=(gn-bn)/d+(gn<bn?6:0);else if(mx===gn)h=(bn-rn)/d+2;else h=(rn-gn)/d+4;h*=60;}
  $('#oS').textContent=`hsl(${Math.round(h)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
}
$('#pk').oninput=e=>upd(e.target.value);$('#hx').oninput=e=>upd(e.target.value);
$('#cp').onclick=()=>copy($('#oH').textContent);upd('#FF6B9D');
</script>
</body>
</html>
