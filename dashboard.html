<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Warung Tools</title>
<meta name="description" content="Kelola API key + quota harian Warung Tools.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>.keybox{font-family:ui-monospace,Menlo,monospace;word-break:break-all;background:#111;color:#7CFFB2;border:var(--b);border-radius:10px;padding:12px;font-size:13px;margin-top:10px}.keybox:empty{display:none}</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/">🛠️ Warung Tools</a></div></header>
<main class="wrap">
  <div class="announce" id="ann"></div>
  <section class="hero"><h1>Dashboard <span class="hl" id="who">lu</span></h1>
  <p id="planline">Loading...</p></section>

  <section class="panel">
    <h2>🔑 API Key gue</h2>
    <p class="sub">Key cuma ditampilkan sekali pas bikin. Simpan baik-baik. Pakai via header <code>x-api-key</code> atau <code>?key=...</code></p>
    <div id="keys"><p>⏳ loading...</p></div>
    <div class="row" style="margin-top:14px">
      <label class="lbl" style="flex:2">Nama key baru<input id="kname" type="text" placeholder="misal: bot-tele" maxlength="60"></label>
      <div style="flex:1;display:flex;align-items:flex-end"><button class="btn p" id="mk">+ Bikin key</button></div>
    </div>
    <div class="keybox" id="newkey"></div>
    <div class="out" id="out"></div>
  </section>

  <section class="panel">
    <h2>🧪 Coba key</h2>
    <p class="sub">Test key lu langsung ke endpoint gempa.</p>
    <div class="btns"><button class="btn blue" id="try">Test /api/gempa</button>
    <button class="btn ghost" id="logout">Keluar</button></div>
    <div class="out" id="tryout"></div>
  </section>
</main>
<footer><div class="wrap"><span>Warung Tools.</span></div></footer>
<script src="/assets/app.js"></script>
<script>
const $=s=>document.querySelector(s);
let ME=null;
async function load(){
  const m=await fetch('/api/auth/me');
  const j=await m.json().catch(()=>({}));
  if(!m.ok||j.ok===false){ location.href='/login'; return; }
  ME=j.data;
  $('#who').textContent=ME.name||ME.email;
  $('#planline').textContent=`Plan ${ME.plan||'free'} • ${ME.email}`+(ME.role==='admin'?' • ADMIN — buka /admin':'');
  const k=await fetch('/api/keys'); const kj=await k.json();
  $('#keys').innerHTML=(kj.data||[]).length
    ? kj.data.map(x=>`<div class="res"><h4>${x.prefix} <span class="chip">${x.status}</span></h4><p class="small">${x.name||''} • quota ${x.quota_day}/hari • bikin ${String(x.created||'').slice(0,10)}</p><button class="btn ghost" data-rv="${x.prefix}" style="margin-top:8px;font-size:12px;padding:8px 12px">Revoke</button></div>`).join('')
    : '<p class="small">Belum ada key. Bikin satu di bawah.</p>';
  document.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>revoke(b.dataset.rv));
}
async function revoke(prefix){
  if(!confirm('Revoke key '+prefix+'? Key ini langsung mati.')) return;
  const r=await fetch('/api/keys/revoke',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix})});
  const j=await r.json();
  $('#out').textContent=r.ok&&j.ok?'✅ key '+prefix+' dimatikan.':'❌ '+(j.error||r.status);
  load();
}
$('#mk').onclick=async()=>{
  $('#newkey').textContent='⏳ bikin...';
  try{
    const r=await fetch('/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#kname').value||'key-1'})});
    const j=await r.json();
    if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status));
    $('#newkey').textContent='KEY BARU (simpan sekarang, cuma muncul sekali):\n'+j.data.key;
    toast('Key baru jadi, simpan!');
    load();
  }catch(e){ $('#newkey').textContent='❌ '+e.message; }
};
$('#try').onclick=async()=>{
  const t=$('#tryout'); t.textContent='⏳...';
  const raw=$('#newkey').textContent.split('\n').pop()||'';
  try{
    const hits=await api('/api/gempa');
    t.textContent='✅ /api/gempa OK tanpa key (anon).\nTambah ?key=KEY lu buat pakai quota key:\ncontoh: /api/gempa?key=wt_live_xxx';
  }catch(e){ t.textContent='❌ '+e.message; }
};
$('#logout').onclick=async()=>{ await fetch('/api/auth/logout',{method:'POST'}); location.href='/'; };
load();
</script>
</body>
</html>
